site_name: "Bookcrossing — отчёт по ЛР1"
site_description: "Серверное приложение на FastAPI + SQLModel + PostgreSQL + Alembic"
site_author: "Цветкова Татьяна Александровна"

repo_url: https://github.com/Tttnya/ITMO_ICT_WebDevelopment_tools_2025-2026
repo_name: Tttnya/…_tools_2025-2026
edit_uri: edit/main/students/K3441/Tsvetkova_Tatyana/Lr1/report/docs/

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate

nav:
  - Главная: index.md
  - Отчёт:
      - Обзор проекта: report/overview.md
      - Модель данных: report/models.md
      - Подключение к БД: report/connection.md
      - Миграции (Alembic): report/migrations.md
      - Авторизация и JWT: report/auth.md
      - API-эндпоинты: report/endpoints.md
      - Запуск: report/run.md
  - Практики:
      - Практика 1.1: practices/pr1.md
      - Практика 1.2: practices/pr2.md
      - Практика 1.3: practices/pr3.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
